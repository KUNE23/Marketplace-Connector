# deploy/nginx.conf
# Contoh konfigurasi nginx untuk Market-Connector (frontend statis + API).
#
# Ganti DOMAIN_ANDA dengan domain sebenarnya, lalu:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/enzyy
#   sudo ln -s /etc/nginx/sites-available/enzyy /etc/nginx/sites-enabled/enzyy
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat HTTPS: sudo certbot --nginx -d DOMAIN_ANDA

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_ANDA;

    # Sertifikat Let's Encrypt (dibuat oleh certbot)
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_ANDA/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_ANDA/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Keamanan dasar untuk aset statis (API sudah pakai helmet)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Kompresi
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- Frontend (hasil `npm run build` di folder Frontend) ----
    root /var/www/enzyy/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset ber-hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API (Express di port 3000) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Worker/browser automation bisa lama; beri waktu cukup
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
